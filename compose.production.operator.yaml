# Enable the separate operator service with:
#   docker compose -f compose.production.yaml -f compose.production.operator.yaml --profile operator up -d
# This also switches Caddy to the customer + operator site configuration.
services:
  caddy:
    volumes:
      - ./deploy/Caddyfile.operator:/etc/caddy/Caddyfile:ro

  operator:
    image: understood:local
    profiles:
      - operator
    restart: unless-stopped
    command: ["node", "scripts/postgres-hosted.mjs", "operator"]
    env_file:
      - ./.env.production.operator
    environment:
      PORT: "10001"
      UNDERSTOOD_TRUSTED_PROXY_NETWORKS: '["172.30.0.10/32"]'
    networks:
      edge:
        ipv4_address: 172.30.0.13
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:10001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    stop_grace_period: 35s
    volumes:
      - ./deploy/runtime:/run/understood:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
